<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" preserveAspectRatio="xMidYMid slice">
  <!-- Signature hero backdrop: a slow-pulsing network of nodes with a
       gold flow travelling one path. A metaphor for the backend systems,
       data pipelines and integrations built here. Animations are pure CSS
       so they run even when the file is embedded via <img>. -->
  <style>
    line { stroke: #cda15f; stroke-width: 1; opacity: .16; }
    .node {
      fill: #cda15f;
      animation: pulse 4s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .node.h { fill: #e0bd83; }
    @keyframes pulse {
      0%, 100% { opacity: .28; r: 3; }
      50%      { opacity: .95; r: 4.4; }
    }
    .flow {
      stroke: #e0bd83;
      stroke-width: 1.5;
      fill: none;
      opacity: .9;
      stroke-dasharray: 4 120;
      animation: flow 5s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -124; } }
    @media (prefers-reduced-motion: reduce) {
      .node, .flow { animation: none; }
      .node { opacity: .5; } .flow { opacity: .3; }
    }
  </style>

  <g>
    <line x1="120" y1="90"  x2="300" y2="150"/>
    <line x1="300" y1="150" x2="480" y2="90"/>
    <line x1="300" y1="150" x2="360" y2="320"/>
    <line x1="480" y1="90"  x2="660" y2="170"/>
    <line x1="660" y1="170" x2="820" y2="110"/>
    <line x1="660" y1="170" x2="700" y2="330"/>
    <line x1="360" y1="320" x2="560" y2="380"/>
    <line x1="560" y1="380" x2="700" y2="330"/>
    <line x1="480" y1="90"  x2="360" y2="320"/>
    <line x1="820" y1="110" x2="880" y2="260"/>
  </g>

  <path class="flow" d="M120,90 L300,150 L480,90 L660,170 L820,110"/>

  <circle class="node"   cx="120" cy="90"  r="3" style="animation-delay:0s"/>
  <circle class="node h" cx="300" cy="150" r="3" style="animation-delay:.6s"/>
  <circle class="node"   cx="480" cy="90"  r="3" style="animation-delay:1.2s"/>
  <circle class="node h" cx="660" cy="170" r="3" style="animation-delay:.3s"/>
  <circle class="node"   cx="820" cy="110" r="3" style="animation-delay:1.8s"/>
  <circle class="node"   cx="360" cy="320" r="3" style="animation-delay:.9s"/>
  <circle class="node h" cx="560" cy="380" r="3" style="animation-delay:1.5s"/>
  <circle class="node"   cx="700" cy="330" r="3" style="animation-delay:2.1s"/>
  <circle class="node"   cx="880" cy="260" r="3" style="animation-delay:1.1s"/>
</svg>
